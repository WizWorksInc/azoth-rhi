name: Feature request
description: Propose an addition or change to the API
labels: ["T: New Feature", "S: Untriaged"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do?
    validations:
      required: true

  - type: textarea
    id: backends
    attributes:
      label: Backend support
      description: How Vulkan, Direct3D 12, and Metal each express this, and where one cannot.
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: Including whether native access under azoth/rhi/native/ covers it.
    validations:
      required: false
